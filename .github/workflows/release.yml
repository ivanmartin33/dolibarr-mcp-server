name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.1.4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build project
      run: pnpm run build

    - name: Build n8n nodes
      working-directory: ./n8n-nodes
      run: |
        pnpm install --frozen-lockfile
        pnpm run build

    - name: Create release archive
      run: |
        # Create production archive
        tar -czf dolibarr-mcp-server-${GITHUB_REF#refs/tags/}.tar.gz \
          .output/ \
          package.json \
          README.md \
          CLAUDE.md \
          .env.example \
          --exclude=node_modules

        # Create n8n nodes archive
        tar -czf dolibarr-mcp-n8n-nodes-${GITHUB_REF#refs/tags/}.tar.gz \
          -C n8n-nodes \
          dist/ \
          package.json \
          README.md \
          --exclude=node_modules

    - name: Extract release notes
      id: extract-release-notes
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

        # Create release notes
        cat > release-notes.md << EOF
        ## Dolibarr MCP Server $VERSION

        ### 🚀 Features
        - Complete MCP (Model Context Protocol) implementation
        - Full CRUD operations for Dolibarr API
        - n8n integration nodes included
        - Production-ready Docker deployment

        ### 📦 What's Included
        - **dolibarr-mcp-server-$VERSION.tar.gz**: Production server build
        - **dolibarr-mcp-n8n-nodes-$VERSION.tar.gz**: n8n community nodes

        ### 🛠️ Installation
        \`\`\`bash
        # Extract and run the server
        tar -xzf dolibarr-mcp-server-$VERSION.tar.gz
        node .output/server/index.mjs
        \`\`\`

        ### 🔧 Requirements
        - Node.js 18+
        - pnpm 9.0+
        - Dolibarr instance with REST API enabled
        - Valid Dolibarr API key

        ### 📖 Documentation
        See README.md and CLAUDE.md for detailed setup and usage instructions.
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release-notes.md
        files: |
          dolibarr-mcp-server-*.tar.gz
          dolibarr-mcp-n8n-nodes-*.tar.gz
        draft: false
        prerelease: ${{ contains(github.ref, '-') }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !contains(github.ref, '-') }} # Only publish stable releases

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.1.4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies and build n8n nodes
      working-directory: ./n8n-nodes
      run: |
        pnpm install --frozen-lockfile
        pnpm run build

    - name: Update package version
      working-directory: ./n8n-nodes
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        pnpm version $VERSION --no-git-tag-version

    - name: Publish n8n nodes to npm
      working-directory: ./n8n-nodes
      run: pnpm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ivanmartin33/dolibarr-mcp-server
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max