services:
  dolibarr-mcp:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Required: Set these variables or use .env file in same directory
      - NITRO_DOLI_URL=${NITRO_DOLI_URL}  # e.g., https://your-dolibarr.com/api/index.php
      - NITRO_DOLI_KEY=${NITRO_DOLI_KEY}  # Your Dolibarr API key
      # Optional: Override defaults if needed
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/mcp/describe"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

